<svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowSolid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/>
    </marker>
    <marker id="arrowDanger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

  <text x="490" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#263238">
    El viaje de un archivo dentro de Git
  </text>

  <!-- ===================== ZONE 1: Directorio de trabajo ===================== -->
  <rect x="30" y="110" width="280" height="360" rx="16" fill="#fdecea" stroke="#e57373" stroke-width="2"/>
  <text x="170" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#b71c1c">📁 Directorio de trabajo</text>
  <text x="170" y="166" text-anchor="middle" font-size="12.5" fill="#8d4444">tus archivos, tal cual los ves</text>

  <!-- Untracked chip -->
  <rect x="55" y="196" width="230" height="86" rx="10" fill="#ef5350"/>
  <text x="170" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">🆕 Untracked</text>
  <text x="170" y="247" text-anchor="middle" font-size="12" fill="#ffffff">archivo nuevo,</text>
  <text x="170" y="263" text-anchor="middle" font-size="12" fill="#ffffff">Git aún no lo sigue</text>

  <!-- Modified chip -->
  <rect x="55" y="310" width="230" height="86" rx="10" fill="#e57373"/>
  <text x="170" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">✏️ Modified</text>
  <text x="170" y="361" text-anchor="middle" font-size="12" fill="#ffffff">archivo ya conocido,</text>
  <text x="170" y="377" text-anchor="middle" font-size="12" fill="#ffffff">pero cambiado desde el último commit</text>

  <text x="170" y="440" text-anchor="middle" font-size="12" fill="#8d4444" font-style="italic">→ esto es lo que</text>
  <text x="170" y="456" text-anchor="middle" font-size="12" fill="#8d4444" font-style="italic">"git status" pinta en rojo</text>

  <!-- ===================== ZONE 2: Staging ===================== -->
  <rect x="370" y="110" width="240" height="360" rx="16" fill="#e8f5e9" stroke="#43a047" stroke-width="2"/>
  <text x="490" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#1b5e20">📦 Área de preparación</text>
  <text x="490" y="166" text-anchor="middle" font-size="12.5" fill="#3a6b3d">(stage / índice)</text>

  <rect x="395" y="230" width="190" height="120" rx="10" fill="#43a047"/>
  <text x="490" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">✅ Staged</text>
  <text x="490" y="292" text-anchor="middle" font-size="12" fill="#ffffff">preparado,</text>
  <text x="490" y="308" text-anchor="middle" font-size="12" fill="#ffffff">listo para entrar</text>
  <text x="490" y="324" text-anchor="middle" font-size="12" fill="#ffffff">en el próximo commit</text>

  <text x="490" y="440" text-anchor="middle" font-size="12" fill="#3a6b3d" font-style="italic">→ esto es lo que</text>
  <text x="490" y="456" text-anchor="middle" font-size="12" fill="#3a6b3d" font-style="italic">"git status" pinta en verde</text>

  <!-- ===================== ZONE 3: Repositorio ===================== -->
  <rect x="660" y="110" width="290" height="360" rx="16" fill="#e3f2fd" stroke="#1e88e5" stroke-width="2"/>
  <text x="805" y="145" text-anchor="middle" font-size="17" font-weight="700" fill="#0d47a1">💾 Repositorio local</text>
  <text x="805" y="166" text-anchor="middle" font-size="12.5" fill="#2b5f8a">historial de versiones</text>

  <rect x="685" y="230" width="240" height="120" rx="10" fill="#1e88e5"/>
  <text x="805" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">💿 Committed</text>
  <text x="805" y="292" text-anchor="middle" font-size="12" fill="#ffffff">confirmado,</text>
  <text x="805" y="308" text-anchor="middle" font-size="12" fill="#ffffff">guardado para siempre</text>
  <text x="805" y="324" text-anchor="middle" font-size="12" fill="#ffffff">en el historial (commit)</text>

  <text x="805" y="440" text-anchor="middle" font-size="12" fill="#2b5f8a" font-style="italic">→ una "foto" ya hecha,</text>
  <text x="805" y="456" text-anchor="middle" font-size="12" fill="#2b5f8a" font-style="italic">recuperable con "git log"</text>

  <!-- ===================== Forward arrows ===================== -->
  <line x1="310" y1="290" x2="366" y2="290" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <rect x="308" y="262" width="60" height="20" rx="5" fill="#ffffff" stroke="#37474f" stroke-width="1"/>
  <text x="338" y="276" text-anchor="middle" font-size="11.5" font-weight="700" fill="#263238">git add</text>

  <line x1="610" y1="290" x2="656" y2="290" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrowSolid)"/>
  <rect x="590" y="262" width="86" height="20" rx="5" fill="#ffffff" stroke="#37474f" stroke-width="1"/>
  <text x="633" y="276" text-anchor="middle" font-size="11.5" font-weight="700" fill="#263238">git commit</text>

  <!-- ===================== Return arrows (curved, above) ===================== -->
  <!-- unstage: staged -> modified -->
  <path d="M 490,222 C 420,150 300,150 200,190" fill="none" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDashed)"/>
  <rect x="270" y="118" width="150" height="20" rx="5" fill="#ffffff" stroke="#9e9e9e" stroke-width="1"/>
  <text x="345" y="132" text-anchor="middle" font-size="11" fill="#616161">git restore --staged</text>

  <!-- discard: committed -> working dir (danger) -->
  <path d="M 760,222 C 650,60 260,60 165,192" fill="none" stroke="#c62828" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowDanger)"/>
  <rect x="600" y="60" width="230" height="34" rx="6" fill="#fff3f3" stroke="#c62828" stroke-width="1"/>
  <text x="715" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#c62828">git checkout -- / git restore</text>
  <text x="715" y="88" text-anchor="middle" font-size="10.5" fill="#c62828">⚠️ descarta los cambios, no se recuperan</text>

  <!-- edit again loop: committed file gets edited -> back to modified -->
  <path d="M 685,300 C 480,470 300,470 205,410" fill="none" stroke="#616161" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arrowDashed)"/>
  <rect x="360" y="478" width="220" height="20" rx="5" fill="#ffffff" stroke="#9e9e9e" stroke-width="1"/>
  <text x="470" y="492" text-anchor="middle" font-size="11" fill="#616161">editas un archivo ya commiteado</text>

  <!-- Legend -->
  <text x="30" y="530" font-size="12" fill="#455a64">🔴 sin preparar</text>
  <text x="150" y="530" font-size="12" fill="#455a64">🟢 preparado (stage)</text>
  <text x="320" y="530" font-size="12" fill="#455a64">🔵 guardado en el historial</text>
  <text x="560" y="530" font-size="12" fill="#455a64">- - - deshacer / mover hacia atrás</text>
</svg>
